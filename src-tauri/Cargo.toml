[package]
name = "chosenone"
version = "0.1.0"
description = "天选之子 — 桌面点名器"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chosenone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
encoding_rs = "0.8"
