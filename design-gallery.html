<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天选之子 · 设计方案画廊</title>
<style>
/* ============================================================
   画廊框架（与方案无关）
   ============================================================ */
:root {
  --font-ui: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: #0e110d;
  color: #dde4dd;
  overflow: hidden;
  user-select: none;
}
.gallery { display: flex; height: 100%; }

/* ---------- 左栏：方案列表 ---------- */
.scheme-list {
  width: 286px; min-width: 286px;
  overflow-y: auto;
  padding: 20px 14px 24px;
  background: #151a15;
  border-right: 1px solid #262c24;
  display: flex; flex-direction: column; gap: 10px;
}
.gallery-head { padding: 2px 6px 12px; }
.gallery-head h1 { font-size: 18px; letter-spacing: 2px; color: #f0f4ee; }
.gallery-head p { font-size: 12px; color: #8a948c; margin-top: 6px; line-height: 1.7; }
.scheme-card {
  padding: 12px 12px 11px;
  border: 1px solid #262c24;
  border-radius: 14px;
  background: #1a201a;
  cursor: pointer;
  transition: transform .18s ease, border-color .2s ease, background .2s ease;
}
.scheme-card:hover { transform: translateY(-2px); border-color: #3d463c; background: #1e261e; }
.scheme-card.active { border-color: #c9d6c4; background: #232b23; box-shadow: 0 0 0 1px #3a443a inset; }
.card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.card-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #eef2ec; }
.card-badge {
  font-size: 10px; letter-spacing: 1px;
  padding: 2px 7px; border-radius: 99px;
  color: #d8e2d4; border: 1px solid #3d463c; white-space: nowrap;
}
.card-badge.shipped  { color: #ffe9b0; border-color: #6a5b2c; background: #2a2413; }
.card-badge.proposal { color: #9fd8c0; border-color: #2f5444; background: #12251d; }
.card-tag { font-size: 11px; color: #8a948c; margin-top: 5px; letter-spacing: .5px; }
.swatches { display: flex; gap: 6px; margin-top: 9px; }
.swatch { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); }
.swatch.wide { width: 26px; border-radius: 5px; }

/* ---------- 右栏：预览 + 说明 ---------- */
.preview {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 26px 30px;
  overflow-y: auto;
}
.preview-stage {
  width: min(680px, 100%);
  animation: fadein .35s ease;
}
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ============================================================
   点名器壳（变量驱动，与 src/index.html 同构；静态 3 行预览）
   ============================================================ */
.app-shell {
  --bd: 18px;
  position: relative;
  width: 100%;
  height: auto;
  border-radius: calc(var(--bd) + 6px);
  background: var(--bg-image);
  background-size: cover;
  background-position: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.45);
  overflow: hidden;
  transition: background .25s ease;
}
.app { position: relative; z-index: 1; display: flex; flex-direction: column; padding-bottom: 0; }

/* 背景动效层：内容之下、指针穿透、不参与布局 */
.bg-fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.bg-fx .fx { position: absolute; }

/* 顶栏 */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 24px 10px; }
.title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand-leaf { width: 24px; height: 24px; color: var(--accent); align-self: center; opacity: .95; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
.title-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 4px; color: var(--ink); text-shadow: var(--row-shadow); white-space: nowrap; }
.title-sub { font-size: 11px; letter-spacing: 2px; color: var(--ink-faint); white-space: nowrap; }
.toolbar { display: flex; gap: 10px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--ink-faint);
  background: transparent; color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .18s ease, background .2s ease;
}
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn:hover { transform: translateY(-2px) rotate(-8deg); background: var(--accent-soft); }

/* 舞台 */
.stage { display: flex; flex-direction: column; align-items: center; padding: 4px 30px 6px; }

/* 窗框：宽度显式给基准（防百分比解析塌缩，历史回归教训） */
.slot-frame {
  position: relative;
  width: min(576px, 100%);
  padding: 8px;
  border-radius: var(--bd);
  background: var(--frame-bg);
  box-shadow:
    0 0 0 1px var(--hairline),
    0 2px 10px rgba(0,0,0,.22),
    0 18px 44px rgba(0,0,0,.32),
    var(--frame-glow),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.slot-viewport {
  position: relative; width: 100%;
  height: 240px; overflow: hidden;
  border-radius: calc(var(--bd) - 4px);
  background: linear-gradient(180deg, var(--fog-top), var(--fog-bottom));
  box-shadow: inset 0 12px 28px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.05);
}
.slot-body { position: absolute; inset: 0; }
.slot-row {
  height: 80px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-size: 42px; font-weight: 700; letter-spacing: 3px;
  color: var(--ink-dim);
  white-space: nowrap; overflow: hidden;
  text-shadow: var(--row-shadow);
}
.slot-row.center {
  color: var(--accent);
  font-size: 46px;
  text-shadow: 0 0 26px var(--accent-soft);
}
.slot-mask { position: absolute; left: 0; right: 0; height: 44px; pointer-events: none; }
.top-mask { top: 0; background: linear-gradient(to bottom, var(--fog-top) 30%, transparent); }
.bottom-mask { bottom: 0; background: linear-gradient(to top, var(--fog-bottom) 30%, transparent); }
.status-hint { margin-top: 11px; font-family: var(--font-display); font-size: 14px; letter-spacing: 1px; color: var(--ink-dim); text-align: center; }

/* 控制区（三栏对称：状态｜中央抽取按钮｜状态） */
.controls { margin-top: 9px; padding: 15px 24px 17px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; background: var(--controls-bg); border-top: 1px dashed var(--hairline); }
.side-stats { display: flex; align-items: center; font-size: 12px; letter-spacing: .5px; color: var(--ink-dim); white-space: nowrap; }
.side-left { justify-content: flex-start; }
.side-right { justify-content: flex-end; gap: 14px; }
.draw-btn {
  position: relative; width: 164px; padding: 13px 0 13px 13px;
  font-family: var(--font-display);
  font-size: 20px; font-weight: 700; letter-spacing: 13px;
  color: var(--btn-ink);
  background: var(--draw-bg);
  border: none; border-radius: calc(var(--bd) - 4px);
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.2), 0 12px 24px rgba(0,0,0,.26);
  transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
}
.draw-btn:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(0,0,0,.16), 0 20px 30px rgba(0,0,0,.26); filter: brightness(1.06); }
.draw-btn::after {
  content: ""; position: absolute; left: 15px; top: 50%;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--btn-ink); opacity: .5;
  box-shadow: 0 9px 0 var(--btn-ink), 0 18px 0 var(--btn-ink);
}
.reset-btn { padding: 5px 13px; border: 1px solid var(--ink-faint); border-radius: 9px; background: transparent; color: var(--ink-dim); cursor: pointer; font-size: 12px; letter-spacing: 1px; }

/* ---------- 背景动效（克制层：低透明 / 慢速 / 不触交互） ---------- */
/* 纪律：元素≤8、透明度≤.7、周期≥8s、中央视口区留空、pointer-events:none、reduced-motion 降级 */

/* 萤火秘境：金色小灯巡游 */
[data-scheme="firefly"] .fx.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #ffd98a;
  box-shadow: 0 0 14px 4px rgba(255, 217, 138, .6);
  opacity: .28;
  animation: fx-firefly 10s ease-in-out infinite alternate;
}
[data-scheme="firefly"] .fx.dot:nth-of-type(1) { left: 10%; top: 26%; animation-duration: 9.5s;  animation-delay: -1.2s; }
[data-scheme="firefly"] .fx.dot:nth-of-type(2) { left: 24%; top: 62%; animation-duration: 12s;   animation-delay: -4.4s; }
[data-scheme="firefly"] .fx.dot:nth-of-type(3) { left: 46%; top: 16%; animation-duration: 10.5s; animation-delay: -2.8s; }
[data-scheme="firefly"] .fx.dot:nth-of-type(4) { left: 64%; top: 48%; animation-duration: 13.5s; animation-delay: -6.2s; }
[data-scheme="firefly"] .fx.dot:nth-of-type(5) { left: 80%; top: 22%; animation-duration: 11s;   animation-delay: -3.5s; }
[data-scheme="firefly"] .fx.dot:nth-of-type(6) { left: 92%; top: 64%; animation-duration: 14s;   animation-delay: -7.7s; }
@keyframes fx-firefly {
  0%   { transform: translate(0, 0) scale(1); opacity: .22; }
  50%  { transform: translate(22px, -34px) scale(1.3); opacity: .85; }
  100% { transform: translate(-16px, -6px) scale(.85); opacity: .3; }
}

/* 樱瓣微风：水彩花瓣旋转飘落 */
[data-scheme="sakura"] .fx.petal {
  top: -20px;
  width: 12px; height: 10px;
  background: linear-gradient(135deg, #f8b9cb, #ef9ab3);
  border-radius: 100% 4px 100% 4px;
  opacity: 0;
  animation: fx-sakura 9s linear infinite;
}
[data-scheme="sakura"] .fx.petal:nth-of-type(1) { left: 4%;  --sway: 26px;  animation-duration: 8.2s;  animation-delay: -1s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(2) { left: 13%; --sway: -20px; animation-duration: 10.5s; animation-delay: -3.4s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(3) { left: 24%; --sway: 34px;  animation-duration: 9.1s;  animation-delay: -5.8s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(4) { left: 38%; --sway: -28px; animation-duration: 11.6s; animation-delay: -2.2s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(5) { left: 52%; --sway: 22px;  animation-duration: 8.8s;  animation-delay: -6.9s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(6) { left: 66%; --sway: -32px; animation-duration: 10.2s; animation-delay: -4.6s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(7) { left: 80%; --sway: 24px;  animation-duration: 9.6s;  animation-delay: -0.9s; }
[data-scheme="sakura"] .fx.petal:nth-of-type(8) { left: 91%; --sway: -18px; animation-duration: 11.1s; animation-delay: -7.4s; }
@keyframes fx-sakura {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
  8%   { opacity: .88; }
  85%  { opacity: .78; }
  100% { transform: translate3d(var(--sway), 560px, 0) rotate(320deg); opacity: 0; }
}

/* 纸鸢青空：纸鸢剪影摆动 + 棉云横移 */
[data-scheme="kite"] .fx.kite {
  width: 16px; height: 16px;
  background: linear-gradient(135deg, #e2543a 0 45%, #f7c9b8 45% 55%, #e2543a 55% 100%);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  opacity: .65;
  animation: fx-kite 11s ease-in-out infinite alternate;
}
[data-scheme="kite"] .fx.kite::after {
  content: ""; position: absolute; left: 6px; top: 13px;
  width: 1px; height: 32px;
  background: linear-gradient(to bottom, rgba(201, 63, 39, .9), transparent);
  box-shadow: 4px 4px 0 -0.5px rgba(201, 63, 39, .9), -3px 8px 0 -0.5px rgba(201, 63, 39, .9);
}
[data-scheme="kite"] .fx.kite:nth-of-type(1) { left: 13%; top: 8%;  animation-duration: 10s; }
[data-scheme="kite"] .fx.kite:nth-of-type(2) { left: 72%; top: 14%; animation-duration: 13s; animation-delay: -4s; }
@keyframes fx-kite {
  0%   { transform: translate(0, 0) rotate(-4deg); }
  50%  { transform: translate(34px, -20px) rotate(3deg); }
  100% { transform: translate(-8px, 14px) rotate(-4deg); }
}
[data-scheme="kite"] .fx.cloud {
  top: 16%; left: -90px;
  width: 84px; height: 24px;
  background: #ffffff;
  border-radius: 20px;
  opacity: .55;
  animation: fx-cloud 40s linear infinite;
}
[data-scheme="kite"] .fx.cloud::before {
  content: ""; position: absolute; left: 16px; top: -14px;
  width: 26px; height: 26px; border-radius: 50%; background: #fff;
}
[data-scheme="kite"] .fx.cloud::after {
  content: ""; position: absolute; left: 38px; top: -9px;
  width: 18px; height: 18px; border-radius: 50%; background: #fff;
}
[data-scheme="kite"] .fx.cloud:nth-of-type(3) { top: 8%;  animation-duration: 34s; animation-delay: -12s; }
[data-scheme="kite"] .fx.cloud:nth-of-type(4) { top: 22%; animation-duration: 46s; animation-delay: -27s; }
[data-scheme="kite"] .fx.cloud:nth-of-type(5) { top: 5%;  animation-duration: 38s; animation-delay: -5s; }
@keyframes fx-cloud { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 90px)); } }

/* 星河流转：星光眨眼 + 流星偶划过 */
[data-scheme="star"] .fx.star {
  width: 2px; height: 2px; border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 4px 1px rgba(255, 255, 255, .35);
  opacity: .2;
  animation: fx-twinkle 3.4s ease-in-out infinite alternate;
}
[data-scheme="star"] .fx.star:nth-of-type(1) { left: 6%;  top: 20%; animation-duration: 2.6s; animation-delay: -0.4s; }
[data-scheme="star"] .fx.star:nth-of-type(2) { left: 18%; top: 10%; animation-duration: 3.8s; animation-delay: -1.8s; }
[data-scheme="star"] .fx.star:nth-of-type(3) { left: 33%; top: 26%; animation-duration: 3.1s; animation-delay: -2.4s; }
[data-scheme="star"] .fx.star:nth-of-type(4) { left: 52%; top: 12%; animation-duration: 4.4s; animation-delay: -0.9s; }
[data-scheme="star"] .fx.star:nth-of-type(5) { left: 66%; top: 24%; animation-duration: 2.9s; animation-delay: -3.1s; }
[data-scheme="star"] .fx.star:nth-of-type(6) { left: 80%; top: 9%;  animation-duration: 4.1s; animation-delay: -1.3s; }
[data-scheme="star"] .fx.star:nth-of-type(7) { left: 90%; top: 22%; animation-duration: 3.5s; animation-delay: -2.7s; }
[data-scheme="star"] .fx.star:nth-of-type(8) { left: 43%; top: 40%; animation-duration: 3.3s; animation-delay: -0.2s; }
@keyframes fx-twinkle { from { opacity: .3; } to { opacity: .95; } }
[data-scheme="star"] .fx.meteor {
  top: -6px; right: -30px;
  width: 74px; height: 1.6px;
  background: linear-gradient(90deg, rgba(255, 217, 138, 0), rgba(255, 255, 255, .9) 70%, #fff);
  border-radius: 2px;
  transform: rotate(-28deg);
  opacity: 0;
  animation: fx-meteor 6.5s linear infinite;
}
[data-scheme="star"] .fx.meteor:nth-of-type(9) { animation-delay: -1.7s; }
[data-scheme="star"] .fx.meteor:nth-of-type(10) { top: -14px; right: -8px; animation-duration: 7.8s; animation-delay: -4.1s; }
@keyframes fx-meteor {
  0%   { transform: translate(0, 0) rotate(-28deg); opacity: 0; }
  4%   { opacity: 1; }
  13%  { transform: translate(-300px, 170px) rotate(-28deg); opacity: 0; }
  100% { transform: translate(-300px, 170px) rotate(-28deg); opacity: 0; }
}

/* 涟漪荷塘：细涟漪扩散 + 荷叶轻摆 */
[data-scheme="ripple"] .fx.ring {
  width: 76px; height: 76px;
  border: 1.2px solid rgba(255, 255, 255, .34);
  border-radius: 50%;
  opacity: 0;
  animation: fx-ripple 8s ease-out infinite;
}
[data-scheme="ripple"] .fx.ring:nth-of-type(1) { left: 12%; top: 64%; animation-duration: 7s;  animation-delay: -1.2s; }
[data-scheme="ripple"] .fx.ring:nth-of-type(2) { left: 38%; top: 78%; animation-duration: 9s;  animation-delay: -4.6s; }
[data-scheme="ripple"] .fx.ring:nth-of-type(3) { left: 62%; top: 66%; animation-duration: 8s;  animation-delay: -2.8s; }
[data-scheme="ripple"] .fx.ring:nth-of-type(4) { left: 88%; top: 82%; animation-duration: 11s; animation-delay: -6.4s; }
@keyframes fx-ripple { 0% { transform: scale(.3); opacity: .75; } 100% { transform: scale(2); opacity: 0; } }
[data-scheme="ripple"] .fx.leaf {
  left: 7%; bottom: 5%;
  width: 54px; height: 45px;
  background: radial-gradient(ellipse at 35% 40%, #3f7a5c, #2b5c45);
  border-radius: 58% 42% 55% 45% / 52% 48% 52% 48%;
  opacity: .52;
  animation: fx-leaf 7s ease-in-out infinite alternate;
}
@keyframes fx-leaf { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

/* 无障碍：系统偏好减少动效时，静止呈现（保留一丝氛围） */
@media (prefers-reduced-motion: reduce) {
  .bg-fx .fx { animation: none !important; opacity: .1; }
}

/* ---------- 设计说明卡 ---------- */
.notes {
  width: min(680px, 100%);
  padding: 14px 20px;
  border: 1px solid #2a3028;
  border-radius: 14px;
  background: #171c17;
}
.notes-name { font-size: 15px; font-weight: 700; color: #f0f4ee; letter-spacing: 1px; }
.notes-name .pos { font-size: 11px; color: #9aa49a; font-weight: 400; margin-left: 8px; letter-spacing: .5px; }
.notes-desc { font-size: 13px; color: #b8c2b8; line-height: 1.8; margin-top: 8px; }
.notes-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.key { font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid #34402f; color: #9fd8c0; background: #12251d; letter-spacing: .5px; }
.footnote { font-size: 11px; color: #6d766d; margin-top: 6px; letter-spacing: .3px; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #2c332b; border-radius: 4px; }

/* ============================================================
   13 套方案主题（全部变量驱动，9-13 带背景动效）
   ============================================================ */

/* ---------- 1 晨雾林窗（现役） ---------- */
[data-scheme="mist"] {
  --font-display: "楷体", "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
  --bd: 18px;
  --bg: #1c2620; --bg-deep: #141c17; --bg-edge: #0f1611;
  --fog-top: #2a3b31; --fog-bottom: #1f2e26;
  --panel: #24332b; --panel-2: #2c3e33; --panel-3: #33483a;
  --ink: #e7efdc; --ink-dim: rgba(231,239,220,.58); --ink-faint: rgba(231,239,220,.24);
  --accent: #e9d48b; --accent-2: #d8bd6b; --accent-soft: rgba(233,212,139,.15);
  --leaf: #b6c98a; --danger: #e08f7a; --btn-ink: #24200f;
  --hairline: rgba(231,239,220,.14); --row-shadow: 0 1px 2px rgba(0,0,0,.28);
  --frame-bg: linear-gradient(160deg, #2a3b31, #1f2e26);
  --frame-glow: transparent;
  --controls-bg: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.05));
  --draw-bg: linear-gradient(135deg, #e9d48b, #d8bd6b);
  --bg-image:
    radial-gradient(120% 90% at 16% 4%, rgba(233,212,139,.10), transparent 58%),
    radial-gradient(110% 85% at 88% 92%, rgba(182,201,138,.08), transparent 55%),
    linear-gradient(168deg, #141c17, #1c2620 55%, #0f1611);
}

/* ---------- 2 绿板粉笔 · 木质课堂（备存） ---------- */
[data-scheme="chalk"] {
  --font-display: "楷体", "KaiTi", "STKaiti", "Microsoft YaHei", sans-serif;
  --bd: 20px;
  --bg: #22352b; --bg-deep: #16251d; --bg-edge: #0f1c15;
  --fog-top: #283d31; --fog-bottom: #1c2d24;
  --panel: #24382e; --panel-2: #2b4034; --panel-3: #33493b;
  --ink: #f3efe2; --ink-dim: rgba(243,239,226,.58); --ink-faint: rgba(243,239,226,.24);
  --accent: #ffd95e; --accent-2: #e2b941; --accent-soft: rgba(255,217,94,.16);
  --leaf: #a8c6ff; --danger: #ff8a7a; --btn-ink: #2a1f08;
  --hairline: rgba(243,239,226,.18); --row-shadow: 0 1px 2px rgba(0,0,0,.3);
  --frame-bg: linear-gradient(115deg, #9a6739, #7c4e27 38%, #8a5a31 62%, #5f3b1d);
  --frame-glow: 0 0 0 4px rgba(243,239,226,.10);

/* 背景动效配置：每套方案的元素类型与数量（JS 生成，CSS 负责外观与错峰） */
const FX_CFG = {
  firefly: { dots: 6 },
  sakura:  { petals: 8 },
  kite:    { kites: 2, clouds: 3 },
  star:    { stars: 8, meteors: 2 },
  ripple:  { rings: 4, leaves: 1 },
};

function renderFx(id) {
  const box = document.getElementById('bgFx');
  const cfg = FX_CFG[id];
  if (!cfg) { box.innerHTML = ''; return; }
  let html = '';
  if (cfg.dots)    html += '<i class="fx dot"></i>'.repeat(cfg.dots);
  if (cfg.petals)  html += '<i class="fx petal"></i>'.repeat(cfg.petals);
  if (cfg.kites)   html += '<i class="fx kite"></i>'.repeat(cfg.kites);
  if (cfg.clouds)  html += '<i class="fx cloud"></i>'.repeat(cfg.clouds);
  if (cfg.stars)   html += '<i class="fx star"></i>'.repeat(cfg.stars);
  if (cfg.meteors) html += '<i class="fx meteor"></i>'.repeat(cfg.meteors);
  if (cfg.rings)   html += '<i class="fx ring"></i>'.repeat(cfg.rings);
  if (cfg.leaves)  html += '<i class="fx leaf"></i>'.repeat(cfg.leaves);
  box.innerHTML = html;
}

const list = document.getElementById('schemeList');
const shell = document.getElementById('appShell');
const titleSub = document.getElementById('titleSub');
const notes = document.getElementById('notes');
const stage = document.querySelector('.preview-stage');

function renderList() {
  list.innerHTML = SCHEMES.map((s, i) => `
    <div class="scheme-card" data-id="${s.id}" data-i="${i}">
      <div class="card-top">
        <span class="card-name">${i + 1}. ${s.name}</span>
        <span class="card-badge ${s.kind}">${s.status}</span>
      </div>
      <div class="card-tag">${s.tag}</div>
      <div class="swatches">
        ${s.swatches.slice(0, 4).map(c => `<span class="swatch" style="background:${c}"></span>`).join('')}
      </div>
    </div>`).join('');
}

function applyScheme(i, skipAnim) {
  const s = SCHEMES[i];
  shell.dataset.scheme = s.id;
  titleSub.textContent = s.sub;
  renderFx(s.id);
  notes.innerHTML = `
    <div class="notes-name">${s.name}<span class="pos">${s.status} · ${s.tag}</span></div>
    <div class="notes-desc">${s.desc}</div>
    <div class="notes-keys">${s.keys.map(k => `<span class="key">${k}</span>`).join('')}</div>`;
  [...list.querySelectorAll('.scheme-card')].forEach(c => c.classList.toggle('active', +c.dataset.i === i));
  if (!skipAnim) {
    stage.style.animation = 'none';
    void stage.offsetWidth;
    stage.style.animation = '';
  }
}

list.addEventListener('click', e => {
  const card = e.target.closest('.scheme-card');
  if (!card) return;
  applyScheme(+card.dataset.i);
});

renderList();
applyScheme(0, true);
